name: "Auto-translate locale files"

on:
  workflow_dispatch:
  schedule:
    # Every 4 hours
    - cron: "0 */4 * * *"

jobs:
  translate:
    name: Fill missing translations from English
    runs-on: ubuntu-latest

    if: github.repository_owner == 'palladium-hub'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 🌍 Translate missing strings
        run: node ./tools/translate-missing.mjs
        env:
          LIBRETRANSLATE_URL: ${{ vars.LIBRETRANSLATE_URL }}

      - name: 📝 Create PR if necessary
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "(chore) Auto-translate missing locale strings"
          title: "(chore) Auto-translate missing locale strings"
          body: |
            # Automated translations

            This PR fills in translation keys whose value still matched the
            English source, using a self-hosted LibreTranslate (open source).

            ## Please review
            Machine translations need a human check before merging — verify
            wording and that `{{interpolation}}` placeholders are intact.

            > Generated by the Auto-translate workflow.
          branch: "chore/auto-translations"
          author: "KenyaEMR CI <info@thepalladiumgroup.com>"
          committer: "KenyaEMR CI <info@thepalladiumgroup.com>"
          token: ${{ secrets.PERSONAL_TOKENS }}
          labels: |
            translations
            automated-pr
          delete-branch: true
